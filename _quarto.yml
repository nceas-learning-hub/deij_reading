project:
  type: website
  output-dir: docs

website:
  title: "NCEAS DEIJ Reading Club"
  site-url: https://your-username.github.io/deij_reading/
  navbar:
    title: NCEAS DEIJ Reading Club
    logo: images/logo_nceas.svg
    logo-alt: "NCEAS Logo"
    right:
      - href: index.qmd
        text: home
      - href: readings.qmd
        text: readings
      - href: blog.qmd
        text: blog
      - icon: github
        href: https://github.com/nceas/deij_reading
        target: _blank
  page-footer:
    background: light
    left: "© 2026 NCEAS"
    right: "Built with [Quarto](https://quarto.org/){target=_blank}"

format:
  html:
    page-layout: full
    sidebar: false
    theme:
      light: styles-light.scss
      dark:  styles-dark.scss
    mainfont: Nunito
    toc: false
    toc-depth: 2
    link-external-newwindow: true ### sets {target = "_blank"} for external links
    link-external-icon: true      ### adds icon to external links
